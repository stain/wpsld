# Runs the tests that read many damaged copies of files (cut short, bytes
# changed, huge lengths, garbage, repeated parts) with the readers of
# files' own metadata (lib's built-in ones, readers-image's
# metadata-extractor, readers-pdf's PDFBox), which ./gradlew build leaves
# out: once a month, when run by hand (Actions -> Run workflow, with more
# rounds if wanted), and on release (release.yml calls it). A failure names
# the file, how it was damaged (with its seed, to repeat it) and the reader
# that hung, ran out of memory or overflowed its stack; wpsld itself
# survives these (each reader is isolated, see FileMetadata), but such a
# reader should be fixed, reported upstream or given a smaller limit.
name: Damaged input tests

on:
  schedule:
    # The 1st of each month, 05:47 UTC (off the hour, as GitHub asks)
    - cron: '47 5 1 * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds of damaged copies of each file (about 100 copies each)
        default: '200'
  workflow_call:

permissions:
  contents: read

jobs:
  damaged-input-tests:
    name: Damaged input tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Read damaged files
        env:
          ROUNDS: ${{ inputs.rounds || '200' }}
        run: ./gradlew --no-daemon damagedTest "-PdamageRounds=$ROUNDS"

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: damaged-input-test-reports
          path: |
            */build/reports/tests/damagedTest/
          if-no-files-found: ignore
