# Runs the tests that ./gradlew build leaves out, as they are slow or
# depend on others: once a month, when run by hand (Actions -> Run
# workflow), and on release (release.yml calls it). Each is a job of its
# own, so that one failing doesn't hide the other; see the test reports
# kept as an artifact.
#
# Online: the tests that use web services (ORCID, ROR, Crossref, DataCite,
# GeoNames, OpenStreetMap's tiles), left out of builds so that they neither
# fail when a service is down nor ask the services on every push. A
# failure means a service is down or has changed what wpsld reads from it.
# GeoNames' test needs a GeoNames username as the repository secret
# GEONAMES_USERNAME, and is skipped without one.
#
# Damaged input: the tests that read many damaged copies of files (cut
# short, bytes changed, huge lengths, garbage, repeated parts) with the
# readers of files' own metadata (lib's built-in ones, readers-image's
# metadata-extractor, readers-pdf's PDFBox). A failure names the file, how
# it was damaged (with its seed, to repeat it) and the reader that hung,
# ran out of memory or overflowed its stack; wpsld itself survives these
# (each reader is isolated, see FileMetadata), but such a reader should be
# fixed, reported upstream or given a smaller limit.
#
# Performance: the tests timing the editor on large crates, step by step
# (see PLAN.md, Performance on larger crates), on Linux only, where they
# take about a minute: macOS's runners are too slow and uneven to time
# on. Each step's time is kept as an artifact (performance.tsv), to
# compare across runs; a failure names the steps over their limits, times
# the slack (2, as the runners are slower than the machine they were set
# on).
name: Integration tests

on:
  schedule:
    # The 1st of each month, 05:17 UTC (off the hour, as GitHub asks)
    - cron: '17 5 1 * *'
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds of damaged copies of each file (about 100 copies each)
        default: '200'
      performanceSlack:
        description: Times the performance tests' limits
        default: '2'
  workflow_call:
    secrets:
      GEONAMES_USERNAME:
        required: false

permissions:
  contents: read

jobs:
  online-tests:
    name: Online tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test with the web services
        env:
          GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
        run: ./gradlew --no-daemon onlineTest

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: online-test-reports
          path: |
            lib/build/reports/tests/onlineTest/
            ui/build/reports/tests/onlineTest/
          if-no-files-found: ignore

  damaged-input-tests:
    name: Damaged input tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Read damaged files
        env:
          ROUNDS: ${{ inputs.rounds || '200' }}
        run: ./gradlew --no-daemon damagedTest "-PdamageRounds=$ROUNDS"

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: damaged-input-test-reports
          path: |
            */build/reports/tests/damagedTest/
          if-no-files-found: ignore

  performance-tests:
    name: Performance tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Time the editor
        env:
          SLACK: ${{ inputs.performanceSlack || '2' }}
        run: ./gradlew --no-daemon performanceTest "-PperformanceSlack=$SLACK"

      - name: Keep the times and the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-test-results
          path: |
            ui/build/test-results/performance.tsv
            ui/build/reports/tests/performanceTest/
          if-no-files-found: ignore
