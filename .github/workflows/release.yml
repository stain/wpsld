# Builds wpsld for each platform JavaFX and Eclipse Temurin both support,
# on that platform's runner, as an app image with a native launcher
# (jpackage: wpsld.exe, wpsld.app, bin/wpsld) and Java and JavaFX included,
# plus a portable zip without JavaFX for any platform (see ui/src/dist).
#
# To release: Actions -> Release -> Run workflow on main, with the version
# (e.g. 0.8.0). It runs scripts/release.sh, pushes its branch
# release-<version> and tag v<version>, then builds the tagged commit and
# makes a draft GitHub release with the zips, to review and publish by hand.
# Open the branch's pull request from the link in the run's summary, and
# merge it with "Create a merge commit".
# A tag pushed by a workflow starts no other workflow, so this run builds it.
#
# A tag v<version> pushed from elsewhere, made with scripts/release.sh so
# that gradle.properties has that version, does the same from the build on
# (or adds the zips to the tag's release, if one was made already). Run
# without a version, the workflow only keeps the zips as workflow artifacts.
#
# Not built: Windows on Arm, as JavaFX 27 has no windows-aarch64 jmods.
# The apps are not signed, so Windows SmartScreen and macOS Gatekeeper
# block them at first; see "The apps are not signed yet" in README.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.8.0; empty only builds the zips'
        required: false
        default: ''
      next:
        description: 'Version after it, without -SNAPSHOT; empty for the minor number one up'
        required: false
        default: ''

permissions:
  contents: read

# One release at a time
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Keep in sync with javafx.version in ui/build.gradle and the Dockerfile
  JAVAFX_VERSION: 27.0.1

jobs:
  # Run by hand with a version: the release's commits and tag, made by
  # scripts/release.sh as from a checkout, then pushed. main takes changes
  # only through pull requests, hence the branch and its pull request
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: From main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release from main, not $GITHUB_REF_NAME"
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Commit and tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
          NEXT: ${{ inputs.next }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/release.sh "$VERSION" $NEXT
          git push --atomic origin "release-$VERSION" "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The pull request is opened by hand: letting workflows open pull
      # requests (Settings -> Actions -> General) would also let them
      # approve them
      - name: Pull request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "Open the pull request of release-$VERSION and merge it with **Create a merge commit**"
            echo "(squash or rebase would leave the tagged commit out of main's history):"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...release-$VERSION?expand=1&title=Release+$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: tag
    # Also when tag is skipped (a pushed tag, or run without a version)
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            jmods-sha256: 323ceb45b938485f6921d7c31c994cc649adb1f75b16192580ff84a3119694ba
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            jmods-sha256: 0cc7436da8f57452370ea6ec47132b5111c1866efa1e384277e5d18824440fb2
          - platform: osx-x64
            runner: macos-15-intel
            jmods-sha256: 65217e4ae9fd58aa2c888463a16a68ca8b3eaf435e0bc695d0b35d97d2d95124
          - platform: osx-aarch64
            runner: macos-15
            jmods-sha256: e7ae63514188b5fe2f1f5913e00c6af15d6f753657ce14a41ebc593c67cec3e0
          - platform: windows-x64
            runner: windows-2025
            jmods-sha256: 5c2a69a7ab42da347b0e8bb244a819e94af75d9f21ae4d129695a3ebc81e3979
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # The tag released, if any: made by the job tag, or pushed
      TAG: ${{ needs.tag.outputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}

      # No cache of Gradle's downloads: what is released is built from the
      # dependencies as their repositories have them, not from what another
      # run left behind
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # The latest 25.x, not one the runner has cached: the JDK's security fixes come between wpsld's releases
          check-latest: true

      # What is released carries this JDK's runtime and its trust store: say which, and stop if it lacks the
      # roots that sites wpsld reads crates from are issued under (HARICA's 2021 roots, under which GEANT TLS
      # issues, as for KU Leuven's repository), as the JDK of the development container did
      - name: The JDK of the release
        run: |
          java -version
          keytool -list -cacerts -storepass changeit | grep -i harica
          keytool -list -cacerts -storepass changeit | grep -qiE 'harica.?tls.?rsa.?root.?ca.?2021' \
            || { echo "::error::This JDK's trust store has no HARICA TLS RSA Root CA 2021"; exit 1; }

      # The version committed in gradle.properties (see scripts/release.sh);
      # a tag must name the same, so that a build of the tagged commit
      # anywhere says the version released
      - name: Version
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties)
          if [[ -n "$TAG" && "$VERSION" != "${TAG#v}" ]]; then
            echo "::error::gradle.properties has version=$VERSION, but the tag is $TAG: release with scripts/release.sh"
            exit 1
          fi
          # And the metadata Zenodo registers the DOI with, and CodeMeta's
          for file in codemeta.json .zenodo.json; do
            META=$(jq -r .version "$file")
            if [[ -n "$TAG" && "$META" != "${TAG#v}" ]]; then
              echo "::error::$file has version $META, but the tag is $TAG: release with scripts/release.sh"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The jmods, so that jlink installs JavaFX's native libraries in the image
      - name: Download JavaFX jmods
        run: |
          curl -fsSLo "$RUNNER_TEMP/javafx-jmods.zip" \
            "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_${{ matrix.platform }}_bin-jmods.zip"
          # Whichever SHA-256 tool the runner has: Git Bash on Windows has no
          # shasum, and maybe no sha256sum, but OpenSSL; all print the digest first.
          # Read from stdin, as sha256sum puts a \ before the digest of a file
          # name with backslashes, such as $RUNNER_TEMP on Windows
          zip="$RUNNER_TEMP/javafx-jmods.zip"
          digest=$( (sha256sum < "$zip" || shasum -a 256 < "$zip" || openssl dgst -sha256 -r < "$zip") 2> /dev/null | cut -d ' ' -f 1)
          if [ "$digest" != "${{ matrix.jmods-sha256 }}" ]; then
            echo "::error::SHA-256 of the JavaFX jmods is '$digest', expected ${{ matrix.jmods-sha256 }}"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP"

      - name: Package
        run: |
          ./gradlew --no-daemon "-Pversion=$VERSION" "-Pplatform=${{ matrix.platform }}" \
            "-PjavafxJmods=$RUNNER_TEMP/javafx-jmods-$JAVAFX_VERSION" \
            :ui:appImageZip ${{ matrix.platform == 'linux-x64' && ':ui:distZip' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: wpsld-${{ matrix.platform }}
          path: |
            ui/build/image-zip/*.zip
            ui/build/distributions/*-portable.zip
          if-no-files-found: error

      # Required on linux-x64, as in the Dockerfile; elsewhere reported, as
      # the headless GUI tests have not been tried there yet
      - name: Test
        continue-on-error: ${{ matrix.platform != 'linux-x64' }}
        run: ./gradlew --no-daemon "-Pversion=$VERSION" build

  # The web services wpsld looks things up in, still answering as it
  # expects, the metadata readers on damaged files, none hanging nor
  # running out of memory, and the editor's times on large crates;
  # reported, but not holding up the release, as a service may just be
  # down for a while
  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    secrets:
      GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}

  release:
    needs: [tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.tag.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # The artifacts keep their folders under ui/build: image-zip/ and distributions/
          mv */*.zip .
          sha256sum *.zip > SHA256SUMS
          # A release of this tag made already (e.g. on GitHub's website)
          # gets the zips, rather than a second one for the same tag
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" *.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" *.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "wpsld ${TAG#v}" --generate-notes
          fi
