# Builds wpsld and runs its tests, including the headless GUI tests, for
# every pull request, and when run by hand (Actions -> Run workflow).
#
# Required on Linux, as in the Dockerfile and release.yml. Windows and macOS
# run too, but only report: their headless GUI tests have not proven
# themselves in CI yet. When tests fail, their reports are kept as an
# artifact of the run.
name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run for the old one
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            required: true
          - os: windows
            runner: windows-2025
            required: false
          - os: macos
            runner: macos-15
            required: false
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            lib/build/reports/tests/
            ui/build/reports/tests/
          if-no-files-found: ignore
