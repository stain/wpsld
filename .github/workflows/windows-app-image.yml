# DRAFT, not yet tested: builds the Windows app image folder with a native
# wpsld.exe launcher, which jpackage can only make on Windows. (The
# Dockerfile cross-links a Windows image with a .bat launcher instead.)
#
# Not triggered by pushes or pull requests; once this file is on the
# default branch it can be started from Actions -> Run workflow.
name: Windows app image (draft)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with javafx.version in ui/build.gradle and the Dockerfile
  JAVAFX_VERSION: 27.0.1
  JAVAFX_WINDOWS_JMODS_SHA256: 5c2a69a7ab42da347b0e8bb244a819e94af75d9f21ae4d129695a3ebc81e3979

jobs:
  windows-app-image:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Download JavaFX jmods
        run: |
          curl -fsSLo javafx-jmods.zip "https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_windows-x64_bin-jmods.zip"
          echo "${JAVAFX_WINDOWS_JMODS_SHA256}  javafx-jmods.zip" | sha256sum -c -
          unzip -q javafx-jmods.zip -d "$RUNNER_TEMP"

      - name: Build, test and package app image
        run: ./gradlew build :ui:jpackageImage "-PjavafxJmods=$RUNNER_TEMP/javafx-jmods-$JAVAFX_VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: wpsld-windows-x64
          path: ui/build/jpackage/wpsld
