# Conda environment for building and running wpsld (lib + JavaFX ui).
# Build with the Gradle wrapper:  ./gradlew build   /   ./gradlew :ui:run
#
# OpenJDK 25, as required by JavaFX 27.
# JavaFX itself is fetched by the org.openjfx Gradle plugin; gtk3 and the
# X11/GL libraries below are what its native code needs at runtime.
name: wpsld
channels:
  - conda-forge
dependencies:
  - openjdk=25
  - gtk3
  - libgl
  - xorg-libxtst
  - xorg-libxxf86vm
  - fontconfig
  - freetype
#
# Note: ./gradlew :ui:jlink does not work with this JDK yet, as conda-forge's
# linux openjdk 25 ships without jmods and without linkable-runtime support
# (conda-forge/openjdk-feedstock#218, fixed by #219). Use the Temurin-based
# Dockerfile to build runtime images instead.
