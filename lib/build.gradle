plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    // Online, the category of tests that use web services, and keeping the
    // other tests offline: shared with ui's tests
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    // File formats by content (magic) and name, as media types; core only, no parsers
    implementation 'org.apache.tika:tika-core:4.2.0'

    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13'

}

// The tests serve profile crates with the JDK's HTTP server. They have no
// module-info, so Gradle runs them on the class path, which reads every
// module: only jdk.httpserver has to be added (not --add-reads for
// no.s11.wpsld, which isn't a module there, and only gave warnings)
tasks.named('compileTestJava') {
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}
tasks.named('test') {
    jvmArgs '--add-modules', 'jdk.httpserver'
}

// The module name's s11 is the organisation's domain (s11.no); javac's lint
// would warn about its digits on every build
tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-module']
}
