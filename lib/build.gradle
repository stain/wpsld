plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    // Online, the category of tests that use web services, and keeping the
    // other tests offline: shared with ui's tests
    id 'java-test-fixtures'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
    // File formats by content (magic) and name, as media types; core only, no parsers
    implementation 'org.apache.tika:tika-core:4.2.0'
    // Descriptions written in Markdown, in the HTML preview
    implementation 'org.commonmark:commonmark:0.32.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.32.0'
    constraints {
        // Tika's, the same version as commonmark's core above
        implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.32.0'
    }
    // The HTML preview's page, a Mustache template (one small jar, no dependencies)
    implementation 'com.samskivert:jmustache:1.16'

    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13.2'
    // Damage's checks
    testFixturesImplementation 'junit:junit:4.13.2'

}

// The tests serve profile crates with the JDK's HTTP server. They have no
// module-info, so Gradle runs them on the class path, which reads every
// module: only jdk.httpserver has to be added (not --add-reads for
// no.s11.wpsld, which isn't a module there, and only gave warnings)
tasks.named('compileTestJava') {
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}
tasks.named('test') {
    jvmArgs '--add-modules', 'jdk.httpserver'
}

// The version, for the User-Agent of every request (see UserAgent)
tasks.named('processResources') {
    inputs.property('version', version.toString())
    filesMatching('**/version.properties') {
        expand(version: version.toString())
    }
}

// The module name's s11 is the organisation's domain (s11.no); javac's lint
// would warn about its digits on every build
tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-module']
}
