plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13'

}

// The tests serve profile crates with the JDK's HTTP server
tasks.named('compileTestJava') {
    options.compilerArgs += ['--add-modules', 'jdk.httpserver', '--add-reads', 'no.s11.wpsld=jdk.httpserver']
}
tasks.named('test') {
    jvmArgs '--add-modules', 'jdk.httpserver', '--add-reads', 'no.s11.wpsld=jdk.httpserver'
}
