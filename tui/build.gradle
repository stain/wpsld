plugins {
    id 'application'
    id 'org.beryx.jlink' version '4.2.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':lib')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
    implementation 'com.googlecode.lanterna:lanterna:3.1.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation testFixtures(project(':lib'))
}

application {
    applicationName = 'wpsld-tui'
    mainClass = 'no.s11.wpsld.tui.Main'
    mainModule = 'no.s11.wpsld.tui'
}

jlink {
    options = ['--strip-debug', '--no-header-files', '--no-man-pages']
    // Tika, one of the merged automatic modules, uses java.sql.
    mergedModule {
        additive = true
        requires 'java.sql'
    }
    launcher {
        name = 'wpsld-tui'
    }
}

tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-module']
}
