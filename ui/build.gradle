 * This generated file contains a sample Java library project to get you started.
 * For more details take a look at the 'Building Java & JVM projects' chapter in the Gradle
 * User Manual available at https://docs.gradle.org/6.8/userguide/building_java_projects.html
 */

plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
  id 'org.beryx.jlink' version '4.2.0'
}

repositories {
    mavenCentral()
}

// The numeric part of the version, as jpackage requires, e.g. 0.1.0 for
// 0.1.0-SNAPSHOT
def numericVersion = version.toString().replaceFirst(/[^0-9.].*$/, '') ?: '0.1.0'
def isMac = System.getProperty('os.name').toLowerCase().contains('mac')

// Platforms to cross-link for (see Dockerfile and the jlink block below),
// as name: [jdkHome, JavaFX jmods]
def crossTargets = project.hasProperty('windowsJdkHome') ? [
    'linux-x64'  : [System.getProperty('java.home'), findProperty('javafxJmods')],
    'windows-x64': [findProperty('windowsJdkHome'), findProperty('windowsJavafxJmods')],
] : [:]

jlink {
    // Ikonli jars contain OSGi component descriptors in the same OSGI-INF
    // package. They are unused outside OSGi and newer jlink rejects the split.
    options = ['--strip-debug', '--no-header-files', '--no-man-pages',
               '--exclude-resources', 'glob:/org.kordamp.ikonli.*/OSGI-INF/**']
    // The jars without modules (Tika, metadata-extractor, xmpcore, PDFBox)
    // are merged into one, whose generated module doesn't require the JDK
    // modules some of them use, failing only in the image, with
    // IllegalAccessError: xmpcore parses XMP with java.xml, PDFBox needs
    // java.desktop, and Tika's TikaInputStream refers to java.sql (Tika's
    // java.compiler is its annotation processor's, for building). Check
    // with jdeps --print-module-deps when adding such a dependency.
    mergedModule {
        additive = true
        requires 'java.xml'
        requires 'java.desktop'
        requires 'java.sql'
    }
    launcher {
        name = 'wpsld'
        // Windows .bat launcher starts javaw, without a console window
        noConsole = true
    }
    // wpsld-cli (the bin module): its own launcher, with a console, beside
    // wpsld's in the image and app image; added to the image, as nothing
    // the editor requires requires it
    secondaryLauncher {
        name = 'wpsld-cli'
        moduleName = 'no.s11.wpsld.cli'
        mainClass = 'no.s11.wpsld.cli.Main'
        winConsole = true
    }
    addOptions('--add-modules', 'no.s11.wpsld.cli')
    // Link JavaFX from its jmods (-PjavafxJmods=<dir>), which install the
    // native libraries into the image; linked from the JavaFX jars they
    // end up inside lib/modules, and JavaFX fails with "no glass".
    //
    // Cross-linking for Windows from Linux (see Dockerfile) additionally takes
    // -PwindowsJdkHome=<dir with jmods/ of the same JDK build as the one
    // running jlink> and -PwindowsJavafxJmods=<dir>, and then builds one
    // image per platform, each linked with its own JavaFX jmods.
    if (crossTargets) {
        crossTargets.each { name, paths ->
            targetPlatform(name) {
                jdkHome = paths[0]
                addExtraModulePath(paths[1])
            }
        }
    } else if (project.hasProperty('javafxJmods')) {
        addExtraModulePath(project.property('javafxJmods'))
    }
    // App image folder with a native launcher (wpsld.exe on Windows);
    // jpackage can only build for the OS it runs on, see
    // .github/workflows/windows-app-image.yml
    jpackage {
        imageName = 'wpsld'
        skipInstaller = true
        // macOS app bundles can't have version 0.x (CFBundleVersion); the
        // zip's name still says which version it is
        appVersion = isMac && numericVersion.startsWith('0') ? '1.0.0' : numericVersion
    }
}

// The licence and the third-party notices (src/notices, which covers the
// built application, not the source), in every zip and in the About box
def notices = files(rootProject.file('LICENSE.txt'), 'src/notices/THIRD-PARTY-NOTICES.txt')

tasks.named('processResources') {
    from(notices) {
        into 'no/s11/wpsld/ui'
    }
    // The version for the About box
    inputs.property('version', version.toString())
    filesMatching('**/about.properties') {
        expand(version: version.toString())
    }
}

// The app image of the platform Gradle runs on, with its native launcher
// (wpsld.exe, wpsld.app or bin/wpsld), zipped as
// build/image-zip/wpsld-<version>-<platform>.zip, e.g. -Pplatform=linux-x64
// as GitHub Actions builds it on each platform (.github/workflows/release.yml)
if (!crossTargets && project.hasProperty('platform')) {
    tasks.register('appImageZip', Zip) {
        dependsOn tasks.named('jpackageImage')
        from(layout.buildDirectory.dir('jpackage'))
        // Beside wpsld.app on macOS, else in the wpsld folder
        from(notices) {
            into(isMac ? '' : 'wpsld')
        }
        archiveFileName = "wpsld-${version}-${findProperty('platform')}.zip"
        destinationDirectory = layout.buildDirectory.dir('image-zip')
        useFileSystemPermissions()
    }
}

// Zip each cross-linked image as build/image-zip/wpsld-<platform>.zip.
// Unlike jlinkZip, Gradle's Zip keeps the executable bits of the launchers.
def imageZips = tasks.register('imageZips')
crossTargets.keySet().each { target ->
    def imageZip = tasks.register("imageZip-${target}", Zip) {
        dependsOn tasks.named('jlink')
        from(layout.buildDirectory.dir("image/wpsld-${target}")) {
            // jlink writes both launchers for every platform; keep only this one's
            exclude(target.startsWith('windows') ? 'bin/wpsld' : 'bin/*.bat')
        }
        from(notices)
        into("wpsld-${target}")
        archiveFileName = "wpsld-${target}.zip"
        destinationDirectory = layout.buildDirectory.dir('image-zip')
        // Gradle 9 normalises permissions in archives by default
        useFileSystemPermissions()
    }
    imageZips.configure { dependsOn imageZip }
}

javafx {
    version = "27.0.1"
    modules = [ 'javafx.controls' ]
}

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13'
    // GUI tests, run headless with JavaFX's own headless platform (JavaFX 26+)
    testImplementation 'org.testfx:testfx-junit:4.0.18'
    testImplementation testFixtures(project(':lib'))

    implementation project(':lib')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'org.commonmark:commonmark:0.31.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.31.0'
    // Readers of files' own metadata, found as services (FileMetadata)
    implementation project(':readers-image')
    implementation project(':readers-pdf')
    // wpsld-cli, a launcher of its own in the images and zips (see jlink)
    runtimeOnly project(':bin')
    // Tika (in lib) logs through SLF4J: to java.util.logging, as all else
    // does (see Logs)
    implementation 'org.slf4j:slf4j-jdk14:2.0.20'
    // Icons as font glyphs: Microsoft's Fluent System Icons, for the
    // Windows 11 style (see Theme)
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-fluentui-pack:12.4.0'

}

test {
    systemProperty 'glass.platform', 'headless'
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'prism.order', 'sw'
    // No map tiles from the web: maps are blank, but work
    systemProperty 'wpsld.mapTiles', 'none'
    // The tests run JavaFX on the class path, in the unnamed module
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // TestFX registers each test's application in a static JavaFX map
    // (ParametersImpl), so every test's scene and form stay in memory until
    // the JVM ends: one JVM per test class, with room for ~25 MB per test
    forkEvery = 1
    maxHeapSize = '1536m'
    // Several test classes at once, each in its own JVM with its own
    // headless JavaFX: one a core, as Gradle is all but idle meanwhile, and
    // at most three JVMs, as each may take its heap (CI's macOS runner has
    // 3 cores and 7 GB; its tests take 4 times as long as on Linux)
    maxParallelForks = Math.max(1, Math.min(3, Runtime.runtime.availableProcessors()))
    // A test JVM short of memory thrashes rather than fails (seen when a
    // class had too many tests): fail instead. All took 8 to 11 minutes one
    // class at a time on Linux, over 20 on macOS in CI, whose runner is
    // slower: more time there.
    timeout = java.time.Duration.ofMinutes(isMac ? 40 : 30)
    // Each test class's time, in the log as it ends and in
    // build/test-results/class-times.tsv (kept by CI), to see which are slow;
    // written as each ends, as the task's time-out loses the reports
    def classTimes = layout.buildDirectory.file('test-results/class-times.tsv')
    doFirst {
        classTimes.get().asFile.with {
            parentFile.mkdirs()
            text = 'class\ttests\tfailed\tskipped\tseconds\n'
        }
    }
    def log = logger
    addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor suite) {}
        void afterSuite(TestDescriptor suite, TestResult result) {
            if (suite.className != null && suite.name == suite.className) {
                def seconds = String.format(Locale.ROOT, '%.1f', (result.endTime - result.startTime) / 1000.0)
                log.lifecycle("${suite.className}: ${result.testCount} tests, ${result.failedTestCount} failed, ${seconds} s")
                classTimes.get().asFile << "${suite.className}\t${result.testCount}\t${result.failedTestCount}\t${result.skippedTestCount}\t${seconds}\n"
            }
        }
        void beforeTest(TestDescriptor test) {}
        void afterTest(TestDescriptor test, TestResult result) {}
    })
    // Each failure in the log as it happens, with its stack (and UiTest's
    // JavaFX thread stack on a time-out), as the report of a class still
    // running is lost when the task's time-out ends it (as on macOS in CI)
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStackTraces = true
    }
}

// The crates the performance tests time the editor on (see
// PerformanceCrates), made again into src/test/resources/performance
tasks.register('performanceCrates', JavaExec) {
    description = 'Makes the crates of the performance tests again.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'no.s11.wpsld.ui.PerformanceCrates'
    args file('src/test/resources/performance').path
}

application {
  applicationName = 'wpsld'
  // Not the CrateEditor itself, so that its log is set up before JavaFX starts
  mainClass = 'no.s11.wpsld.ui.Main'
  mainModule = 'no.s11.wpsld.ui'
}

// The distribution zip (distZip) is for any platform with Java 25 and
// JavaFX 27: JavaFX is left out, and the launchers put all of lib/ on the
// module path rather than each jar, so it comes from a JDK that includes
// JavaFX or from the JavaFX SDK's lib/ copied into lib/ (see src/dist)
distributions {
    main {
        contents {
            exclude 'javafx-*.jar'
            from(notices)
        }
    }
}

tasks.named('distZip') {
    archiveClassifier = 'portable'
}

// Both launchers' module path: all of lib/
def wholeLib = { CreateStartScripts scripts ->
    scripts.unixScript.text = scripts.unixScript.text.replaceFirst(/(?m)^MODULE_PATH=.*$/,
            java.util.regex.Matcher.quoteReplacement('MODULE_PATH=$APP_HOME/lib'))
    scripts.windowsScript.text = scripts.windowsScript.text.replaceFirst(/(?m)^set MODULE_PATH=.*$/,
            java.util.regex.Matcher.quoteReplacement('set MODULE_PATH=%APP_HOME%\\lib'))
}
tasks.named('startScripts') {
    doLast { wholeLib(it) }
}

// wpsld-cli's launchers beside wpsld's in the distribution zip; it needs
// no JavaFX, as only the modules it requires are loaded
def cliStartScripts = tasks.register('cliStartScripts', CreateStartScripts) {
    def scripts = tasks.named('startScripts', CreateStartScripts).get()
    applicationName = 'wpsld-cli'
    mainModule = 'no.s11.wpsld.cli'
    mainClass = 'no.s11.wpsld.cli.Main'
    classpath = scripts.classpath
    modularity.inferModulePath = scripts.modularity.inferModulePath
    outputDir = layout.buildDirectory.dir('cli-scripts').get().asFile
    doLast { wholeLib(it) }
}
distributions.main.contents {
    from(cliStartScripts) {
        into 'bin'
        filePermissions { unix('rwxr-xr-x') }
    }
}

// The module name's s11 is the organisation's domain (s11.no); javac's lint
// would warn about its digits on every build
tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-module']
}
