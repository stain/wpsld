 *
 * This generated file contains a sample Java library project to get you started.
 * For more details take a look at the 'Building Java & JVM projects' chapter in the Gradle
 * User Manual available at https://docs.gradle.org/6.8/userguide/building_java_projects.html
 */

plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0'
  id 'org.beryx.jlink' version '4.2.0'
}

repositories {
    mavenCentral()
}

// The numeric part of the version, as jpackage requires, e.g. 0.1.0 for
// 0.1.0-SNAPSHOT
def numericVersion = version.toString().replaceFirst(/[^0-9.].*$/, '') ?: '0.1.0'
def isMac = System.getProperty('os.name').toLowerCase().contains('mac')

// Platforms to cross-link for (see Dockerfile and the jlink block below),
// as name: [jdkHome, JavaFX jmods]
def crossTargets = project.hasProperty('windowsJdkHome') ? [
    'linux-x64'  : [System.getProperty('java.home'), findProperty('javafxJmods')],
    'windows-x64': [findProperty('windowsJdkHome'), findProperty('windowsJavafxJmods')],
] : [:]

jlink {
    options = ['--strip-debug', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'wpsld'
        // Windows .bat launcher starts javaw, without a console window
        noConsole = true
    }
    // Link JavaFX from its jmods (-PjavafxJmods=<dir>), which install the
    // native libraries into the image; linked from the JavaFX jars they
    // end up inside lib/modules, and JavaFX fails with "no glass".
    //
    // Cross-linking for Windows from Linux (see Dockerfile) additionally takes
    // -PwindowsJdkHome=<dir with jmods/ of the same JDK build as the one
    // running jlink> and -PwindowsJavafxJmods=<dir>, and then builds one
    // image per platform, each linked with its own JavaFX jmods.
    if (crossTargets) {
        crossTargets.each { name, paths ->
            targetPlatform(name) {
                jdkHome = paths[0]
                addExtraModulePath(paths[1])
            }
        }
    } else if (project.hasProperty('javafxJmods')) {
        addExtraModulePath(project.property('javafxJmods'))
    }
    // App image folder with a native launcher (wpsld.exe on Windows);
    // jpackage can only build for the OS it runs on, see
    // .github/workflows/windows-app-image.yml
    jpackage {
        imageName = 'wpsld'
        skipInstaller = true
        // macOS app bundles can't have version 0.x (CFBundleVersion); the
        // zip's name still says which version it is
        appVersion = isMac && numericVersion.startsWith('0') ? '1.0.0' : numericVersion
    }
}

// The licence and the third-party notices (src/notices, which covers the
// built application, not the source), in every zip and in the About box
def notices = files(rootProject.file('LICENSE.txt'), 'src/notices/THIRD-PARTY-NOTICES.txt')

tasks.named('processResources') {
    from(notices) {
        into 'no/s11/wpsld/ui'
    }
    // The version for the About box
    inputs.property('version', version.toString())
    filesMatching('**/about.properties') {
        expand(version: version.toString())
    }
}

// The app image of the platform Gradle runs on, with its native launcher
// (wpsld.exe, wpsld.app or bin/wpsld), zipped as
// build/image-zip/wpsld-<version>-<platform>.zip, e.g. -Pplatform=linux-x64
// as GitHub Actions builds it on each platform (.github/workflows/release.yml)
if (!crossTargets && project.hasProperty('platform')) {
    tasks.register('appImageZip', Zip) {
        dependsOn tasks.named('jpackageImage')
        from(layout.buildDirectory.dir('jpackage'))
        // Beside wpsld.app on macOS, else in the wpsld folder
        from(notices) {
            into(isMac ? '' : 'wpsld')
        }
        archiveFileName = "wpsld-${version}-${findProperty('platform')}.zip"
        destinationDirectory = layout.buildDirectory.dir('image-zip')
        useFileSystemPermissions()
    }
}

// Zip each cross-linked image as build/image-zip/wpsld-<platform>.zip.
// Unlike jlinkZip, Gradle's Zip keeps the executable bits of the launchers.
def imageZips = tasks.register('imageZips')
crossTargets.keySet().each { target ->
    def imageZip = tasks.register("imageZip-${target}", Zip) {
        dependsOn tasks.named('jlink')
        from(layout.buildDirectory.dir("image/wpsld-${target}")) {
            // jlink writes both launchers for every platform; keep only this one's
            exclude(target.startsWith('windows') ? 'bin/wpsld' : 'bin/*.bat')
        }
        from(notices)
        into("wpsld-${target}")
        archiveFileName = "wpsld-${target}.zip"
        destinationDirectory = layout.buildDirectory.dir('image-zip')
        // Gradle 9 normalises permissions in archives by default
        useFileSystemPermissions()
    }
    imageZips.configure { dependsOn imageZip }
}

javafx {
    version = "27.0.1"
    modules = [ 'javafx.controls' ]
}

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13'
    // GUI tests, run headless with JavaFX's own headless platform (JavaFX 26+)
    testImplementation 'org.testfx:testfx-junit:4.0.18'

    implementation project(':lib')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'org.commonmark:commonmark:0.24.0'
    // Icons as font glyphs: Microsoft's Fluent System Icons, for the
    // Windows 11 style (see Theme)
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    implementation 'org.kordamp.ikonli:ikonli-fluentui-pack:12.4.0'

}

test {
    systemProperty 'glass.platform', 'headless'
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'prism.order', 'sw'
    // The tests run JavaFX on the class path, in the unnamed module
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // TestFX registers each test's application in a static JavaFX map
    // (ParametersImpl), so every test's scene and form stay in memory until
    // the JVM ends: one JVM per test class, with room for ~25 MB per test
    forkEvery = 1
    maxHeapSize = '1536m'
}

application {
  applicationName = 'wpsld'
  mainClass = 'no.s11.wpsld.ui.CrateEditor'
  mainModule = 'no.s11.wpsld.ui'
}

// The distribution zip (distZip) is for any platform with Java 25 and
// JavaFX 27: JavaFX is left out, and the launchers put all of lib/ on the
// module path rather than each jar, so it comes from a JDK that includes
// JavaFX or from the JavaFX SDK's lib/ copied into lib/ (see src/dist)
distributions {
    main {
        contents {
            exclude 'javafx-*.jar'
            from(notices)
        }
    }
}

tasks.named('distZip') {
    archiveClassifier = 'portable'
}

tasks.named('startScripts') {
    doLast {
        unixScript.text = unixScript.text.replaceFirst(/(?m)^MODULE_PATH=.*$/,
                java.util.regex.Matcher.quoteReplacement('MODULE_PATH=$APP_HOME/lib'))
        windowsScript.text = windowsScript.text.replaceFirst(/(?m)^set MODULE_PATH=.*$/,
                java.util.regex.Matcher.quoteReplacement('set MODULE_PATH=%APP_HOME%\\lib'))
    }
}

// The module name's s11 is the organisation's domain (s11.no); javac's lint
// would warn about its digits on every build
tasks.named('compileJava') {
    options.compilerArgs += ['-Xlint:-module']
}
