# wpsld's logging (java.util.logging), read by Logs, which adds the file
# in the user's log folder; the console is for when started from a terminal
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
# e.g. 2026-11-15 12:00:38.123 WARNING no.s11.wpsld.lookup.FileMetadata: ...
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL %4$s %3$s: %5$s%6$s%n

# PDFBox and its fonts tell at INFO of each font they look for and stand in
# for; their warnings of what's wrong in a PDF are enough
org.apache.pdfbox.level = WARNING
org.apache.fontbox.level = WARNING
